# pnpm 10+ moved these settings out of package.json's "pnpm" field.
# See https://pnpm.io/settings

# esbuild ships a platform binary via a postinstall script; Vite needs it.
#
# core-js@2 and es5-ext arrive transitively under pagedjs. Their postinstall
# scripts only print funding banners — nothing is built and nothing depends on
# them running — so they stay off rather than executing arbitrary install-time
# code for no benefit.
allowBuilds:
  core-js: false
  es5-ext: false
  esbuild: true

peerDependencyRules:
  allowedVersions:
    # nonaction@0.0.5 declares react ^16.8.0. It is a ~40-line hooks + context
    # container and is API-compatible with React 18. It is unmaintained, so the
    # declaration will not be updated. Accepted knowingly.
    nonaction>react: '18'
